interface:
  display_name: "纠纷材料整理"
  short_description: "使用固定模板整理当前案件附件并回写同一记录"
  default_prompt: "使用 $organize-dispute-materials 6.9.0 处理 dispute-material-run/v6.7 JSON。原样保存并校验运行信封，一次提取全部附件。原生文本直接进入逐字语料。视觉任务由 vision_tool.py prepare 生成清单，再由 transcribe 将真实图片上传到纠纷材料视觉核验员的独立附件会话并读回结果，最后由 reconcile 校验。音频只用飞书妙记远端逐字稿。纠纷材料整理专员是唯一事实合并者和业务写入者。每个实质事实必须以 source_refs 绑定材料 SHA-256 和逐字引文。不得改写程序生成的质量行或自由编造 Base 业务字段。候选报告、Base 阶段绑定、上传人 full_access 和最终提交都必须读回。失败先分类当前 Base 和文档状态，禁止无条件回滚。最终写后重新读取 Base、完整报告和全部协作者权限。只有 validate-completion 返回 completed 才返回完成。"
